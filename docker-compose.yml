services:
  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
      POSTGRES_DB: quant_db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data


  redis:
    image: redis:7

    ports:
      - "6379:6379"


  minio:
    image: minio/minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - miniodata:/data


  airflow:
    build:
      context: .
      dockerfile: Dockerfile

    command: standalone

    environment:
      MINIO_URL: "http://minio:9000"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags/project/airflow_dags"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin"

    ports:
      - "8080:8080"

    volumes:
      - ./:/opt/airflow/dags/project

    depends_on:
      - minio
      - postgres


volumes:
  pgdata:
  miniodata: