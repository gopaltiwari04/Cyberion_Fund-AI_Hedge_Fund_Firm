version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
      POSTGRES_DB: quant_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  airflow:
    image: apache/airflow:2.8.1
    command: standalone
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=yfinance==0.2.38 pandas pyarrow boto3 requests
      - MINIO_URL=http://minio:9000
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - minio
      - postgres
volumes:
  pgdata:
  miniodata: